services:
  db:
    image: postgres:18-alpine
    container_name: imagelab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagelab
      POSTGRES_PASSWORD: imagelabpass
      POSTGRES_DB: imagelab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagelab -d imagelab"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: imagelab_migrate
    command: /usr/local/bin/migrate -path /app/migrations -database "postgres://imagelab:imagelabpass@db:5432/imagelab?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: imagelab_api
    ports:
      - "4000:4000"
    environment:
      IMAGELAB_DB_DSN: "postgres://imagelab:imagelabpass@db:5432/imagelab?sslmode=disable"
      PORT: "4000"
    volumes:
      - ./storage:/app/storage
      - ./frontend:/app/frontend          # live-edit UI during Phase 3, no rebuild
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Flip conditions by editing API_ARGS in .env — never edit this file per-run
    command: sh -c '/app/api -db-dsn="postgres://imagelab:imagelabpass@db:5432/imagelab?sslmode=disable" ${API_ARGS}'

volumes:
  pgdata: